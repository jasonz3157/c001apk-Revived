name: Release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      existing_draft_tag:
        description: 'Optional existing draft tag to reuse'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          keytool -list -keystore "$RUNNER_TEMP/release.p12" \
            -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null
          printf 'KEYSTORE_PATH=%s\nKEYSTORE_PASSWORD=%s\nKEY_ALIAS=%s\nKEY_PASSWORD=%s\n' \
            "$RUNNER_TEMP/release.p12" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
            > local.properties
          keytool -exportcert -rfc -keystore "$RUNNER_TEMP/release.p12" \
            -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" \
            -file "$RUNNER_TEMP/signing-certificate.pem"

      - name: Build signed Release APK and run unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --max-workers=2 \
            :app:assembleRelease :app:testDebugUnitTest :media-support:testDebugUnitTest

      - name: Verify APK signature and prepare checksums
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f)
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          tag="$(git rev-list HEAD --count)-$(git rev-parse --short HEAD)"
          safe_apk="$(dirname "$apk")/c001apk-Revived_$tag.apk"
          mv -- "$apk" "$safe_apk"
          apk="$safe_apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" \
            | tee "$RUNNER_TEMP/apk-signature.txt"
          grep -F 'Signer #1 certificate SHA-256 digest: 327ecf7831c68b7fb755508a7e61bffdb00a275cdf92f6d091f3993d05597f28' \
            "$RUNNER_TEMP/apk-signature.txt"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          (cd "$(dirname "$apk")" && sha256sum "$(basename "$apk")" > SHA256SUMS)

      - name: Upload signed build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: c001apk-Revived-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.apk.outputs.tag }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          EXISTING_DRAFT_TAG: ${{ inputs.existing_draft_tag }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## 本次更新

          - 新增“设置 → 屏蔽 → 关键字屏蔽”，支持 miuix 与 MD3。
          - 每行一个关键字，动态标题、正文或转发内容包含任意关键字即隐藏整张卡片；保存后刷新生效。
          - 关键字按字面包含匹配，不区分英文大小写；忽略空行与重复条目，重启后保留，清空保存可解除屏蔽。
          - 匹配 HTML 解码后的可见文字，评论和私信不受影响。对应改动：#3。
          - 包含此前 miuix“我的”页面闪退修复和暗色启动图标调整。

          ## 安装说明

          此版本复用本 fork 已发布版本的独立签名，可覆盖升级并保留数据。从上游原版首次切换时，因签名不同，通常需要先备份数据，再卸载旧版后安装。

          ## 验证

          Release 构建和单元测试通过，并已使用 apksigner 校验独立签名。手机桌面效果仍需安装后确认。

          附件包含 APK、SHA256SUMS 和公开签名证书。证书不包含私钥。
          NOTES
          printf '\n构建提交：%s\n' "$GITHUB_SHA" >> "$RUNNER_TEMP/release-notes.md"
          if test -n "$EXISTING_DRAFT_TAG"; then
            test "$(gh release view "$EXISTING_DRAFT_TAG" --json isDraft --jq .isDraft)" = true
            gh release edit "$EXISTING_DRAFT_TAG" --tag "$RELEASE_TAG" --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG · 关键字屏蔽" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG · 关键字屏蔽" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$RELEASE_TAG" "$APK_PATH" \
            app/build/outputs/apk/release/SHA256SUMS "$RUNNER_TEMP/signing-certificate.pem" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/release.p12" local.properties
